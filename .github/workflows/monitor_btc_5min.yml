name: Monitor BTC/EUR 5min

'on':
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy requests yagmail

      - name: Ejecutar el monitor de 5 min
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor_estrategia_btc_5min_ghactions.py

      - name: Guardar el estado
        run: |
          git config user.name "Monitor BTC 5min bot"
          git config user.email "actions@github.com"
          git add monitor_estado_5min.json monitor_historial_5min.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Actualizar estado del monitor 5min [skip ci]"
          git push || true
